<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材切り替えテスト</title>
<style>
  html, body { margin: 0; }
  body {
    font-family: sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px 12px 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  button { font-size: 16px; min-height: 40px; }
  #panel { text-align: center; max-width: 320px; }
  #pos { color: #888; font-size: 13px; margin: 0 0 8px; }
  #img { display: none; max-width: 100%; height: auto; margin: 0 auto 8px; border-radius: 4px; }
  #txt { font-size: 16px; line-height: 1.6; margin: 0 0 8px; white-space: pre-wrap; }
  #note { font-size: 12px; color: #888; min-height: 1.4em; margin: 0; }
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 0 12px;
    box-sizing: border-box;
  }
  #controls button { padding: 0 10px; }
  #ver {
    position: fixed;
    bottom: 4px;
    left: 6px;
    font-size: 11px;
    color: #888;
  }
  #editlink {
    position: fixed;
    top: 4px;
    left: 6px;
    font-size: 12px;
    color: #555;
    text-decoration: none;
  }
</style>
</head>
<body>
<a id="editlink" href="edit/">編集ページへ →</a>
<div id="panel">
  <p id="pos">-</p>
  <img id="img" alt="">
  <p id="txt">-</p>
  <p id="note"></p>
</div>
<div id="controls">
  <button id="next">つぎへ</button>
  <button id="toggle">a版</button>
  <button id="loadBtn">b版データを読み込む</button>
  <button id="imgLoadBtn">b版画像を読み込む</button>
  <button id="clearBtn">読み込んだデータを消す</button>
</div>
<input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<input type="file" id="imgInput" accept="image/*" multiple style="display:none">
<span id="ver">v0.6</span>
<script src="data/text-a.js"></script>
<script>
const MODE_KEY = 'switchTestMode';
const LOADED_KEY = 'switchTestLoadedB';
const IMG_KEY = 'switchTestLoadedBImages';
const KEYS_A = Object.keys(TEXT_A).map(Number).sort((a, b) => a - b);
const RATIOS = [[4, 3], [16, 9], [1, 1], [3, 4], [9, 16]];
let idx = 0;

function getLoadedB() {
  const raw = localStorage.getItem(LOADED_KEY);
  if (!raw) return null;
  try {
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : null;
  } catch (e) {
    return null;
  }
}
function getLoadedBImages() {
  const raw = localStorage.getItem(IMG_KEY);
  if (!raw) return {};
  try {
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  } catch (e) {
    return {};
  }
}
function bKeys() {
  const data = getLoadedB();
  if (!data) return [];
  return Object.keys(data).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
}
function effectiveMode() {
  return localStorage.getItem(MODE_KEY) === 'b' ? 'b' : 'a';
}
function currentKeys() {
  return effectiveMode() === 'a' ? KEYS_A : bKeys();
}
function imgId(n) {
  return 's' + String(n).padStart(3, '0');
}
function placeholderSrc(id, i) {
  const r = RATIOS[i % RATIOS.length];
  const w = 240, h = Math.round(240 * r[1] / r[0]);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
    + '<rect width="100%" height="100%" fill="#ccc"/>'
    + '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#555">'
    + id + ' (' + r[0] + ':' + r[1] + ')</text></svg>';
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}
function updateImage(mode, key) {
  const imgEl = document.getElementById('img');
  if (key === undefined) {
    imgEl.style.display = 'none';
    imgEl.removeAttribute('src');
    return;
  }
  const id = imgId(key);
  if (mode === 'a') {
    imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = placeholderSrc(id, idx); };
    imgEl.src = 'img/a/' + id + '.png';
    imgEl.style.display = 'block';
    return;
  }
  const images = getLoadedBImages();
  if (images[id]) {
    imgEl.onerror = null;
    imgEl.src = images[id];
    imgEl.style.display = 'block';
  } else {
    imgEl.removeAttribute('src');
    imgEl.style.display = 'none';
  }
}
function render() {
  const mode = effectiveMode();
  document.getElementById('toggle').textContent = mode === 'b' ? 'b版' : 'a版';
  const hasLoaded = !!getLoadedB() || Object.keys(getLoadedBImages()).length > 0;
  document.getElementById('clearBtn').disabled = !hasLoaded;
  if (mode === 'a') {
    const key = KEYS_A[idx];
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + KEYS_A.length;
    document.getElementById('txt').textContent = TEXT_A[key] || '';
    document.getElementById('note').textContent = '';
    updateImage('a', key);
    return;
  }
  const data = getLoadedB();
  if (!data) {
    document.getElementById('pos').textContent = '-';
    document.getElementById('txt').textContent = 'b版データが未読み込み';
    document.getElementById('note').textContent = '';
    updateImage('b', undefined);
    return;
  }
  const keys = bKeys();
  const key = keys[idx];
  document.getElementById('pos').textContent = (idx + 1) + ' / ' + keys.length;
  document.getElementById('txt').textContent = data[key] || '';
  document.getElementById('note').textContent = '';
  updateImage('b', key);
}
document.getElementById('next').onclick = () => {
  const keys = currentKeys();
  if (keys.length === 0) return;
  idx = (idx + 1) % keys.length;
  render();
};
document.getElementById('toggle').onclick = () => {
  localStorage.setItem(MODE_KEY, effectiveMode() === 'a' ? 'b' : 'a');
  idx = 0;
  render();
};
document.getElementById('loadBtn').onclick = () => {
  document.getElementById('fileInput').click();
};
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('invalid');
      localStorage.setItem(LOADED_KEY, JSON.stringify(obj));
      idx = 0;
      render();
    } catch (err) {
      alert('読み込めませんでした。JSON形式のファイルを選んでください。');
    }
  };
  reader.readAsText(file);
};
document.getElementById('imgLoadBtn').onclick = () => {
  document.getElementById('imgInput').click();
};
document.getElementById('imgInput').onchange = (e) => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (files.length === 0) return;
  const images = getLoadedBImages();
  let remaining = files.length;
  files.forEach(file => {
    const id = file.name.replace(/\.[^/.]+$/, '');
    const reader = new FileReader();
    reader.onload = () => {
      images[id] = reader.result;
      remaining--;
      if (remaining === 0) {
        localStorage.setItem(IMG_KEY, JSON.stringify(images));
        render();
      }
    };
    reader.readAsDataURL(file);
  });
};
document.getElementById('clearBtn').onclick = () => {
  localStorage.removeItem(LOADED_KEY);
  localStorage.removeItem(IMG_KEY);
  idx = 0;
  render();
};
render();
</script>
</body>
</html>
