<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ローグ最小版</title>
<style>
  html, body { margin: 0; }
  body {
    font-family: sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px 12px 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button { font-size: 18px; min-height: 40px; }
  #panel { text-align: center; }
  #actions { margin-top: 12px; text-align: center; }
  #dpad {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(3, 52px);
    gap: 6px;
  }
  #ver {
    position: fixed;
    right: 6px;
    bottom: 4px;
    font-size: 11px;
    color: #888;
  }
</style>
</head>
<body>
<div id="panel">
  <p id="st" style="margin:0 0 8px;">-</p>
  <p id="f" style="font-family:monospace; font-size:18px; line-height:1.15; white-space:pre; margin:0 0 8px;"></p>
  <p id="msg" style="margin:0 0 12px;">-</p>
</div>
<div id="actions">
  <button id="down" disabled>降りる</button>
  <button id="heal" disabled>★で回復</button>
  <button id="fuel" disabled>★でたいまつ</button>
  <button id="rs" style="display:none;">もう一度</button>
</div>
<div id="dpad">
  <span></span><button id="u">↑</button><span></span>
  <button id="l">←</button><span></span><button id="r">→</button>
  <span></span><button id="d">↓</button><span></span>
</div>
<span id="ver">v0.2</span>
<script>
const W = 15, H = 11, MAXHP = 10, MAXT = 100;
let map, seen, items, enemies, px, py, stx, sty;
let floor = 1, stars = 0, hp = MAXHP, torch = MAXT, best = 1, dead = false;
const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const inBounds = (i, j) => i >= 0 && i < W && j >= 0 && j < H;
const sight = () => torch > 60 ? 3 : torch > 25 ? 2 : torch > 0 ? 1 : 0;
const enemyAt = (i, j) => enemies.findIndex(e => e.x === i && e.y === j);
function carve(x, y) {
  if (x > 0 && x < W - 1 && y > 0 && y < H - 1) map[y][x] = '.';
}
function freeCell(i, j) {
  return map[j][i] === '.' && !(i === px && j === py) && !(i === stx && j === sty) &&
    !items.some(it => it[0] === i && it[1] === j) && enemyAt(i, j) < 0;
}
function gen() {
  map = Array.from({ length: H }, () => Array(W).fill('#'));
  seen = Array.from({ length: H }, () => Array(W).fill(false));
  items = [];
  enemies = [];
  const rooms = [];
  let tries = 0;
  while (rooms.length < 5 && tries < 80) {
    tries++;
    const w = 3 + rand(3), h = 3 + rand(2);
    const x0 = 1 + rand(W - w - 2), y0 = 1 + rand(H - h - 2);
    const hit = rooms.some(r =>
      x0 - 1 < r.x + r.w && x0 + w + 1 > r.x && y0 - 1 < r.y + r.h && y0 + h + 1 > r.y
    );
    if (hit) continue;
    for (let j = y0; j < y0 + h; j++) for (let i = x0; i < x0 + w; i++) carve(i, j);
    rooms.push({ x: x0, y: y0, w: w, h: h });
  }
  const center = r => [r.x + Math.floor(r.w / 2), r.y + Math.floor(r.h / 2)];
  for (let k = 1; k < rooms.length; k++) {
    const a = center(rooms[k - 1]), b = center(rooms[k]);
    let x = a[0], y = a[1];
    const stepX = () => { while (x !== b[0]) { x += Math.sign(b[0] - x); carve(x, y); } };
    const stepY = () => { while (y !== b[1]) { y += Math.sign(b[1] - y); carve(x, y); } };
    if (Math.random() < 0.5) { stepX(); stepY(); } else { stepY(); stepX(); }
  }
  const start = center(rooms[0]);
  px = start[0];
  py = start[1];
  const last = rooms[rooms.length - 1];
  stx = -1; sty = -1;
  let g = 0;
  do {
    stx = last.x + rand(last.w);
    sty = last.y + rand(last.h);
    g++;
  } while (stx === px && sty === py && g < 50);
  g = 0;
  while (items.length < 3 && g < 300) {
    g++;
    const ix = rand(W), iy = rand(H);
    if (freeCell(ix, iy)) items.push([ix, iy]);
  }
  const count = Math.min(6, 2 + Math.floor(floor / 2));
  g = 0;
  while (enemies.length < count && g < 500) {
    g++;
    const ex = rand(W), ey = rand(H);
    if (!freeCell(ex, ey)) continue;
    if (Math.abs(ex - px) + Math.abs(ey - py) < 5) continue;
    enemies.push({ x: ex, y: ey, hp: 2 + Math.floor(floor / 3) });
  }
  reveal();
}
function visible(i, j) {
  return Math.max(Math.abs(i - px), Math.abs(j - py)) <= sight();
}
function reveal() {
  const s = sight();
  for (let j = py - s; j <= py + s; j++) {
    for (let i = px - s; i <= px + s; i++) {
      if (inBounds(i, j)) seen[j][i] = true;
    }
  }
}
function draw() {
  $('st').textContent = '地下' + floor + '階　HP ' + hp + '/' + MAXHP + '　たいまつ ' + torch + '　★ ' + stars + '　最深 ' + best + '階';
  const rows = [];
  for (let j = 0; j < H; j++) {
    let s = '';
    for (let i = 0; i < W; i++) {
      if (!seen[j][i]) s += '　';
      else if (i === px && j === py) s += '＠';
      else if (enemyAt(i, j) >= 0 && visible(i, j)) s += '敵';
      else if (items.some(it => it[0] === i && it[1] === j)) s += '★';
      else if (i === stx && j === sty) s += '▼';
      else s += map[j][i] === '#' ? '■' : '・';
    }
    rows.push(s);
  }
  $('f').textContent = rows.join('\n');
  ['u', 'd', 'l', 'r'].forEach(id => $(id).disabled = dead);
  $('down').disabled = dead || !(px === stx && py === sty);
  $('heal').disabled = dead || stars < 1 || hp >= MAXHP;
  $('fuel').disabled = dead || stars < 1 || torch >= MAXT;
}
function enemiesAct(log) {
  for (const e of enemies) {
    const dist = Math.abs(e.x - px) + Math.abs(e.y - py);
    if (dist === 1) {
      const dmg = floor >= 4 ? 1 + rand(2) : 1;
      hp -= dmg;
      log.push('敵の攻撃 -' + dmg);
      continue;
    }
    const dirs = DIRS.slice().sort(() => Math.random() - 0.5);
    const ok = (nx, ny) => inBounds(nx, ny) && map[ny][nx] !== '#' && enemyAt(nx, ny) < 0 && !(nx === px && ny === py);
    if (dist <= 6) {
      let bestStep = null, bestD = dist;
      for (const d of dirs) {
        const nx = e.x + d[0], ny = e.y + d[1];
        if (!ok(nx, ny)) continue;
        const nd = Math.abs(nx - px) + Math.abs(ny - py);
        if (nd < bestD) {
          bestD = nd;
          bestStep = [nx, ny];
        }
      }
      if (bestStep) {
        e.x = bestStep[0];
        e.y = bestStep[1];
      }
    } else if (Math.random() < 0.5) {
      for (const d of dirs) {
        const nx = e.x + d[0], ny = e.y + d[1];
        if (!ok(nx, ny)) continue;
        e.x = nx;
        e.y = ny;
        break;
      }
    }
  }
}
function endTurn(log) {
  enemiesAct(log);
  if (hp <= 0) {
    hp = 0;
    dead = true;
    log.push('倒れた…地下' + floor + '階');
    $('rs').style.display = 'inline-block';
  }
  reveal();
  $('msg').textContent = log.length ? log.join('　') : '-';
  draw();
}
function move(dx, dy) {
  if (dead) return;
  const nx = px + dx, ny = py + dy;
  if (!inBounds(nx, ny) || map[ny][nx] === '#') return;
  const log = [];
  const k = enemyAt(nx, ny);
  if (k >= 0) {
    const dmg = 1 + rand(2);
    enemies[k].hp -= dmg;
    log.push('敵に' + dmg + 'ダメージ');
    if (enemies[k].hp <= 0) {
      enemies.splice(k, 1);
      log.push('敵を倒した');
    }
    endTurn(log);
    return;
  }
  px = nx;
  py = ny;
  const before = torch;
  torch = Math.max(0, torch - 1);
  if (before > 0 && torch === 0) log.push('たいまつが消えた…');
  const it = items.findIndex(t => t[0] === px && t[1] === py);
  if (it >= 0) {
    items.splice(it, 1);
    stars++;
    log.push('★を拾った');
  }
  if (px === stx && py === sty) log.push('階段がある');
  endTurn(log);
}
$('u').onclick = () => move(0, -1);
$('d').onclick = () => move(0, 1);
$('l').onclick = () => move(-1, 0);
$('r').onclick = () => move(1, 0);
$('heal').onclick = () => {
  if (dead || stars < 1 || hp >= MAXHP) return;
  stars--;
  hp = Math.min(MAXHP, hp + 5);
  endTurn(['★で回復した']);
};
$('fuel').onclick = () => {
  if (dead || stars < 1 || torch >= MAXT) return;
  stars--;
  torch = Math.min(MAXT, torch + 40);
  endTurn(['★でたいまつを補充した']);
};
$('down').onclick = () => {
  if (dead || !(px === stx && py === sty)) return;
  floor++;
  best = Math.max(best, floor);
  gen();
  $('msg').textContent = '地下' + floor + '階に降りた';
  draw();
};
$('rs').onclick = () => {
  floor = 1; stars = 0; hp = MAXHP; torch = MAXT; dead = false;
  gen();
  $('msg').textContent = '-';
  $('rs').style.display = 'none';
  draw();
};
gen();
draw();
</script>
</body>
</html>
